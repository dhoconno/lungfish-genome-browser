# parameters.yaml, the operation settings registry for the Lungfish Genome
# Explorer user manual. Owner: Code Cartographer. Filled by Phase 2 of the
# 2026-09 fidelity campaign. Chapters cite operation ids in frontmatter
# parameters_refs; the settings-coverage lint rule checks that a chapter's
# "## Settings" section documents every setting listed here.
#
# Schema:
#   operations:
#     <operation_id>:
#       title: <human name as shown in the app>
#       entry_points: [<menu path>, "CLI: lungfish-cli ..."]
#       gating: [<pack id>, docker, experimental]   # [] when none
#       sources: [<Sources/ path>, ...]
#       settings:
#         - label: <control label exactly as the app shows it>
#           control: checkbox | number | slider | popup | text | file | radio
#           default: <value>
#           allowed: <range, list, or "any">
#           effect: <one or two plain sentences>
#           when_to_change: <one sentence, or "rarely">
#           cli_flag: <flag or null>
#       cli_only:
#         - flag: <flag>
#           default: <value>
#           effect: <one sentence>
#       notes: <free text>
version: 0
operations:
  fastq.refresh-qc-summary:
    title: Refresh QC Summary
    entry_points:
      - "Tools > QC & Reporting > Refresh QC Summary..."
      - "CLI: lungfish-cli fastq qc-summary <inputs> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishApp/App/ToolsMenuModel.swift
    settings:
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether the run writes one QC summary next to each selected dataset or pools every selected dataset into one summary. Per Input keeps each library separate.
        when_to_change: Switch to Grouped Result when the selected files are parts of one library and you want a single set of numbers.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing summary file at the output path instead of stopping.
      - flag: --compress
        default: "false"
        effect: Writes the summary gzip-compressed.
    notes: >-
      The dialog shows no tool-specific controls. Its Primary Settings pane reads
      "No additional primary settings are required for this QC summary refresh."
      Read counts, length distribution, and quality statistics are all computed
      from the selected FASTQ data with no tunable inputs.

  fastq.demultiplex-barcodes:
    title: Demultiplex Barcodes
    entry_points:
      - "Tools > Demultiplexing > Demultiplex Barcodes..."
      - "CLI: lungfish-cli fastq demultiplex <input> --kit <kit> --output <dir>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Barcode Source
        control: radio
        default: Built-In Kit
        allowed: Built-In Kit, Custom Definition
        effect: Chooses whether the barcode sequences come from a kit that ships with the app or from a file you supply. Custom Definition asks for a barcode file in the Inputs section.
        when_to_change: Pick Custom Definition when your barcodes came from a plate layout or an in-house primer set rather than a commercial kit.
        cli_flag: --kit
      - label: Built-In Kit
        control: popup
        default: the first registered built-in kit
        allowed: "truseq-single-a, truseq-single-b, truseq-ht-dual, nextera-xt-v2, idt-ud-indexes, fluidigm-access-array, pacbio-sequel-16-v3, pacbio-sequel-96-v2, pacbio-sequel-384-v1, m13-universal-primers, ont-nbd104, ont-nbd114, ont-nbd104-114, ont-nbd114-96, ont-pbc096, ont-rbk004, ont-rbk114-24, ont-rbk114-96, ont-16s114-24, ont-rab204-214"
        effect: Names the commercial barcode set used to split the pooled reads. Each kit is a fixed list of index sequences and their sample labels.
        when_to_change: Change it to match the kit the library was prepared with, because a wrong kit assigns almost every read to the unassigned bin.
        cli_flag: --kit
      - label: Engine
        control: radio
        default: Cutadapt
        allowed: Cutadapt, Exact Bare Barcode
        effect: Chooses the matcher. Cutadapt allows mismatches and insertions near a read end, and Exact Bare Barcode scans the whole read for a perfect barcode match or its reverse complement.
        when_to_change: Use Exact Bare Barcode when barcodes sit at unpredictable positions inside the read and you want no fuzzy matches at all.
        cli_flag: --engine
      - label: Location
        control: radio
        default: Both Ends
        allowed: Both Ends, 5' End, 3' End
        effect: Tells Cutadapt where in the read a barcode is allowed to sit. Both Ends accepts a match anchored at either terminus.
        when_to_change: Narrow it to one end when your library design puts the index only at that end and you are seeing spurious assignments.
        cli_flag: --location
      - label: 5' Distance
        control: number
        default: 0
        allowed: integers 0 and above
        effect: How many bases inward from the start of the read the barcode may begin. Zero means the barcode must start at the very first base.
        when_to_change: Raise it when a few leading bases of adapter or untrimmed sequence sit in front of the barcode.
        cli_flag: --max-distance-5prime
      - label: 3' Distance
        control: number
        default: 0
        allowed: integers 0 and above
        effect: How many bases inward from the end of the read the barcode may end. Zero means the barcode must end at the very last base.
        when_to_change: Raise it when trailing bases follow the barcode at the read end.
        cli_flag: --max-distance-3prime
      - label: Error Rate
        control: number
        default: 0.15
        allowed: fractions between 0 and 1
        effect: The fraction of barcode bases Cutadapt may see as wrong and still call it a match. At 0.15 a 20-base barcode tolerates three mismatched bases.
        when_to_change: Lower it toward 0.05 when samples are cross-assigning, and raise it when a large share of reads land in the unassigned bin.
        cli_flag: --error-rate
      - label: Trim Barcodes
        control: checkbox
        default: true
        allowed: "true, false"
        effect: Removes the matched barcode sequence from each read before writing it out. Turning it off keeps the barcode in the read.
        when_to_change: Turn it off when a downstream step expects to see the index in the read, for example a second demultiplexing pass.
        cli_flag: --no-trim (inverted)
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is demultiplexed into its own folder of per-barcode bundles or all of them are pooled first.
        when_to_change: Choose Grouped Result when one library was sequenced across several files and its barcodes should be counted together.
        cli_flag: null
    cli_only:
      - flag: --overlap
        default: "3"
        effect: Sets the minimum number of barcode bases that must overlap the read for Cutadapt to consider a match.
      - flag: --discard-unassigned
        default: "false"
        effect: Throws away reads that match no barcode rather than writing them to an unassigned bundle.
      - flag: --threads
        default: "4"
        effect: Sets how many Cutadapt worker threads run at once.
    notes: >-
      Location, 5' Distance, 3' Distance, Error Rate, and Trim Barcodes appear
      only while Engine is Cutadapt. With Custom Definition selected, the dialog
      asks for a CSV, TSV, or whitespace-delimited file with columns
      id,sequence[,secondary_sequence][,sample_name].

  fastq.ont-fluidigm-sample-split:
    title: ONT Fluidigm Sample Split
    entry_points:
      - "Tools > Demultiplexing > ONT Fluidigm Sample Split..."
      - "CLI: lungfish-cli fastq ont-fluidigm-samples <input> --barcodes <file> --output <dir>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings: []
    cli_only:
      - flag: --primer-mismatches
        default: "2"
        effect: The number of mismatched bases allowed when locating the CS1 and CS2 primer boundaries that mark the amplicon insert.
      - flag: --minimum-insert-length
        default: "20"
        effect: The shortest CS1-to-CS2 insert that is kept, in bases.
      - flag: --canonicalize-reverse-complements
        default: "disabled"
        effect: Folds an insert and its exact reverse complement into one counted exemplar after the reads are oriented.
      - flag: --threads
        default: "1"
        effect: Recorded for provenance only, because materialization does not yet run in parallel.
      - flag: --force
        default: "false"
        effect: Replaces an existing output directory instead of stopping.
    notes: >-
      The dialog exposes no settings for this operation. Its pane reads "Uses the
      selected Fluidigm sample barcode definition, extracts CS1-CS2 inserts, and
      writes one counted FASTQ bundle per sample." The barcode definition is
      chosen in the Inputs section, and the output mode is fixed to a batch, so
      no Output Strategy picker appears.

  fastq.fastp-trim:
    title: fastp Adapter + Quality Trim
    entry_points:
      - "Tools > Trimming & Filtering > fastp Adapter + Quality Trim..."
      - "CLI: lungfish-cli fastq trim <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Threshold
        control: number
        default: 20
        allowed: integers above 0
        effect: The lowest Phred quality score a base may have before fastp treats it as unreliable. A score of 20 means the base caller expects to be wrong about once in a hundred.
        when_to_change: Raise it toward 30 when you need very clean bases for variant calling, and lower it when trimming is discarding too much of every read.
        cli_flag: --threshold
      - label: Window Size
        control: number
        default: 4
        allowed: integers above 0
        effect: How many neighbouring bases fastp averages before deciding to cut. A window of 4 smooths over a single bad base.
        when_to_change: Use a larger window for long reads whose quality drifts slowly, and a smaller one for a sharp quality cliff at the read end.
        cli_flag: --window
      - label: Mode
        control: radio
        default: Cut Right
        allowed: Cut Right, Cut Front, Cut Tail, Cut Both
        effect: Chooses which end of the read is scanned and in which direction. Cut Right walks from the start toward the end and truncates at the first bad window.
        when_to_change: Switch to Cut Both when quality is poor at both ends, which is common in older Illumina runs.
        cli_flag: --mode
      - label: Adapter Mode
        control: radio
        default: Auto-Detect
        allowed: Auto-Detect, Manual Sequence
        effect: Chooses whether fastp works out the adapter sequence from the data itself or uses a sequence you type in. Auto-Detect looks for sequence shared across many reads.
        when_to_change: Use Manual Sequence when you know the exact adapter from the library kit and auto-detection is missing it.
        cli_flag: --adapter
      - label: Adapter Sequence
        control: text
        default: ""
        allowed: A, C, G, T and IUPAC ambiguity codes
        effect: The literal adapter sequence fastp removes from the end of each read. It is used only when Adapter Mode is Manual Sequence.
        when_to_change: Fill it in when your kit documentation gives an adapter that auto-detection does not find.
        cli_flag: --adapter
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is trimmed into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to the same library and you want one trimmed bundle.
        cli_flag: null
    cli_only:
      - flag: --extra-args
        default: "empty"
        effect: Passes additional fastp arguments through verbatim after the resolved settings.
      - flag: --no-adapter-trimming
        default: "adapter trimming enabled"
        effect: Runs the quality pass without removing adapters, which the dialog never does because it always trims adapters in this operation.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the trimmed FASTQ gzip-compressed.
    notes: >-
      Adapter Sequence appears only while Adapter Mode is Manual Sequence. This
      operation always runs adapter detection and quality trimming in the same
      fastp pass, so the CLI's --no-adapter-trimming has no dialog counterpart.

  fastq.quality-trim:
    title: Quality Trim
    entry_points:
      - "Tools > Trimming & Filtering > Quality Trim..."
      - "CLI: lungfish-cli fastq quality-trim <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Threshold
        control: number
        default: 20
        allowed: integers above 0
        effect: The lowest Phred quality score a base may have before fastp treats it as unreliable. A score of 20 means about one wrong base in a hundred.
        when_to_change: Raise it toward 30 for variant calling, and lower it when too much of every read is being cut away.
        cli_flag: --threshold
      - label: Window Size
        control: number
        default: 4
        allowed: integers above 0
        effect: How many neighbouring bases fastp averages before deciding to cut. A larger window ignores single bad bases.
        when_to_change: Use a larger window for long reads with slowly drifting quality.
        cli_flag: --window
      - label: Mode
        control: radio
        default: Cut Right
        allowed: Cut Right, Cut Front, Cut Tail, Cut Both
        effect: Chooses which end is scanned and in which direction. Cut Right walks from the start and truncates at the first bad window.
        when_to_change: Switch to Cut Both when quality is poor at both ends of the read.
        cli_flag: --mode
      - label: Extra arguments
        control: text
        default: ""
        allowed: any fastp command-line arguments
        effect: Extra fastp options passed straight through after the settings above. They are not checked by the app before fastp sees them.
        when_to_change: Use it only when you need a fastp feature the dialog does not expose.
        cli_flag: --extra-args
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is trimmed into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the trimmed FASTQ gzip-compressed.
    notes: >-
      This operation trims quality only. Use fastp Adapter + Quality Trim to
      remove adapters at the same time.

  fastq.adapter-removal:
    title: Adapter Removal
    entry_points:
      - "Tools > Trimming & Filtering > Adapter Removal..."
      - "CLI: lungfish-cli fastq adapter-trim <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Adapter Mode
        control: radio
        default: Auto-Detect
        allowed: Auto-Detect, Manual Sequence
        effect: Chooses whether fastp works out the adapter from the data or uses the sequence you type in. Auto-Detect looks for sequence shared across many reads.
        when_to_change: Use Manual Sequence when your kit documents the adapter and auto-detection misses it.
        cli_flag: --adapter
      - label: Adapter Sequence
        control: text
        default: ""
        allowed: A, C, G, T and IUPAC ambiguity codes
        effect: The literal adapter sequence removed from the end of each read. It is used only when Adapter Mode is Manual Sequence.
        when_to_change: Fill it in when you know the exact adapter from the library kit.
        cli_flag: --adapter
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is trimmed into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the trimmed FASTQ gzip-compressed.
    notes: >-
      Adapter Sequence appears only while Adapter Mode is Manual Sequence. The
      Advanced Settings pane states that manual adapter trimming exposes a single
      literal sequence.

  fastq.primer-trimming:
    title: Primer Trimming
    entry_points:
      - "Tools > Trimming & Filtering > Primer Trimming..."
      - "CLI: lungfish-cli fastq primer-remove <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Primer Source
        control: radio
        default: Literal Sequence
        allowed: Literal Sequence, Reference FASTA
        effect: Chooses whether you type one primer sequence or point at a FASTA file holding a whole primer set. Reference FASTA asks for the file in the Inputs section.
        when_to_change: Pick Reference FASTA for tiled amplicon schemes, which have dozens of primers.
        cli_flag: --literal or --ref
      - label: Primer Sequence
        control: text
        default: ""
        allowed: A, C, G, T and IUPAC ambiguity codes
        effect: The primer sequence bbduk removes from the reads. It is used only when Primer Source is Literal Sequence.
        when_to_change: Type the primer your PCR used, exactly as the order sheet gives it.
        cli_flag: --literal
      - label: k
        control: number
        default: 15
        allowed: integers above 0
        effect: The length of the exact-match word bbduk uses to spot the primer. Longer words are more specific and less tolerant of errors.
        when_to_change: Shorten it when short primers are being missed, and lengthen it when non-primer sequence is being trimmed.
        cli_flag: --kmer
      - label: mink
        control: number
        default: 11
        allowed: integers above 0
        effect: The shortest word bbduk will still match when only part of the primer sits at the very end of a read. It catches primers that run off the edge.
        when_to_change: Lower it when partial primers survive at read ends.
        cli_flag: --mink
      - label: hdist
        control: number
        default: 1
        allowed: integers 0 and above
        effect: How many mismatched bases a primer match may contain. Zero demands a perfect match.
        when_to_change: Raise it to 2 for noisy long reads, and drop it to 0 when trimming is eating real sequence.
        cli_flag: --hdist
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is trimmed into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --engine
        default: "bbduk"
        effect: Selects the trimming engine, either bbduk or cutadapt-linked, and the dialog always uses bbduk.
      - flag: --minimum-overlap
        default: "12"
        effect: The minimum overlap for cutadapt-linked primer matching, so it applies only to the cutadapt-linked engine.
      - flag: --error-rate
        default: "0.12"
        effect: The maximum error rate for cutadapt-linked primer matching, so it applies only to the cutadapt-linked engine.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the trimmed FASTQ gzip-compressed.
    notes: >-
      Primer Sequence, k, mink, and hdist appear only while Primer Source is
      Literal Sequence. The dialog default for k is 15 while the CLI default for
      --kmer is 23, so a command copied from the CLI help will not reproduce a
      dialog run unless --kmer 15 is given.

  fastq.trim-fixed-bases:
    title: Trim Fixed Bases
    entry_points:
      - "Tools > Trimming & Filtering > Trim Fixed Bases..."
      - "CLI: lungfish-cli fastq fixed-trim <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: 5' Trim
        control: number
        default: 0
        allowed: integers 0 and above
        effect: How many bases are cut from the start of every read, no matter what those bases are. The count is applied to every read alike.
        when_to_change: Set it when the library design puts a fixed tag or unique molecular identifier at the start of the read.
        cli_flag: --front
      - label: 3' Trim
        control: number
        default: 0
        allowed: integers 0 and above
        effect: How many bases are cut from the end of every read. The count is applied to every read alike.
        when_to_change: Set it when a fixed number of trailing bases are known to be unreliable.
        cli_flag: --tail
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is trimmed into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the trimmed FASTQ gzip-compressed.
    notes: >-
      The Advanced Settings pane says trim values are applied exactly as entered,
      with no quality check and no minimum-length guard.

  fastq.filter-by-read-length:
    title: Filter by Read Length
    entry_points:
      - "Tools > Trimming & Filtering > Filter by Read Length..."
      - "CLI: lungfish-cli fastq length-filter <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Min Length
        control: number
        default: empty
        allowed: integers above 0, or empty for no lower bound
        effect: The shortest read kept, in bases. Reads below it are discarded.
        when_to_change: Set it to your amplicon length or a little below when short fragments are only adapter dimer.
        cli_flag: --min
      - label: Max Length
        control: number
        default: empty
        allowed: integers above 0, or empty for no upper bound
        effect: The longest read kept, in bases. Reads above it are discarded.
        when_to_change: Set it when concatemers or chimaeric long reads are inflating your data.
        cli_flag: --max
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is filtered into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the filtered FASTQ gzip-compressed.
    notes: >-
      Both bounds start empty. Leaving one empty removes that bound rather than
      applying a hidden default.

  fastq.remove-human-reads:
    title: Remove Human Reads
    entry_points:
      - "Tools > Decontamination > Remove Human Reads..."
      - "CLI: lungfish-cli fastq scrub-human <input> --database-id <id> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is scrubbed into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --remove-reads
        default: "false"
        effect: A deprecated compatibility flag that is ignored, because Deacon always removes matched reads.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the scrubbed FASTQ gzip-compressed.
    notes: >-
      The Primary Settings pane reads "This tool uses the dedicated embedded
      workflow pane or the fixed database chooser above", so the human database
      is picked in the Inputs section rather than as a settings control. The
      chosen database supplies the CLI's --database-id.

  fastq.remove-ribosomal-rna:
    title: Remove ribosomal RNA sequences
    entry_points:
      - "Tools > Decontamination > Remove ribosomal RNA sequences..."
      - "CLI: lungfish-cli fastq deacon-ribo <inputs> --output <dir>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishIO/Formats/FASTQ/FASTQDerivatives.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Retain Reads
        control: radio
        default: non-rRNA
        allowed: non-rRNA, rRNA, Both
        effect: Chooses which class of reads is written out. Ribosomal RNA is the abundant structural RNA of the ribosome, and it usually swamps the sequences of interest in an RNA library.
        when_to_change: Choose rRNA when you want to inspect what was removed, and Both when you want two bundles from one pass.
        cli_flag: --retain
    cli_only:
      - flag: --database-id
        default: "deacon-ribokmers"
        effect: Names the managed Deacon database of ribosomal k-mers used for matching.
      - flag: --absolute-threshold
        default: "1"
        effect: The minimum number of matching minimizers before a read is called ribosomal.
      - flag: --relative-threshold
        default: "0.0"
        effect: The minimum share of a read's minimizers that must match before it is called ribosomal.
      - flag: --format
        default: "text"
        effect: Chooses the report format written alongside the reads, either text, json, or tsv.
      - flag: --threads
        default: "auto"
        effect: Sets how many worker threads Deacon uses.
    notes: >-
      This operation has no Output Strategy picker, because supportsConfigurableOutput
      excludes it. The Advanced Settings pane notes that Deacon uses the managed
      BBMap ribokmers index with sensitive minimizer thresholds, which are not
      exposed in the dialog.

  fastq.remove-contaminants:
    title: Remove Contaminants
    entry_points:
      - "Tools > Decontamination > Remove Contaminants..."
      - "CLI: lungfish-cli fastq contaminant-filter <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Contaminant Mode
        control: radio
        default: PhiX
        allowed: PhiX, Custom Reference
        effect: Chooses what counts as a contaminant. PhiX is the small control genome Illumina spikes into runs, and Custom Reference lets you supply any FASTA.
        when_to_change: Choose Custom Reference to strip a vector, a carrier genome, or a known spike-in other than PhiX.
        cli_flag: --mode
      - label: K-mer
        control: number
        default: 31
        allowed: integers above 0
        effect: The length of the exact-match word bbduk uses to recognise contaminant sequence. Longer words match more specifically.
        when_to_change: Shorten it when contaminant reads are noisy and slipping through.
        cli_flag: --kmer
      - label: Hamming Distance
        control: number
        default: 1
        allowed: integers 0 and above
        effect: How many mismatched bases a k-mer match may contain. Zero demands a perfect match.
        when_to_change: Raise it for error-prone reads, and lower it when real sample reads are being discarded.
        cli_flag: --hdist
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is filtered into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the filtered FASTQ gzip-compressed.
    notes: >-
      With Custom Reference selected the dialog asks for the contaminant FASTA in
      the Inputs section, which supplies the CLI's --ref.

  fastq.low-complexity-filter:
    title: Low-Complexity Filter
    entry_points:
      - "Tools > Decontamination > Low-Complexity Filter..."
      - "CLI: lungfish-cli fastq entropy-filter <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishIO/Formats/FASTQ/FASTQEntropyFilter.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Entropy Threshold
        control: slider
        default: 0.60
        allowed: 0.3 to 0.9 in steps of 0.05
        effect: Shannon entropy scores how varied a stretch of sequence is, from 0 for a single repeated base up to 1 for an even mix. Reads scoring below this value are discarded as repetitive.
        when_to_change: Raise it when homopolymer runs and tandem repeats are inflating apparent coverage, and lower it when real low-complexity regions are being lost.
        cli_flag: --entropy
      - label: Window
        control: number
        default: 50
        allowed: integers above 0
        effect: The length in bases of the sliding stretch over which entropy is measured. A read is judged window by window rather than as a whole.
        when_to_change: Shorten it for short reads, so at least one full window fits inside each read.
        cli_flag: --window
      - label: K-mer
        control: number
        default: 5
        allowed: integers above 0
        effect: The word length counted when estimating entropy inside each window. Longer words distinguish repeat patterns more finely.
        when_to_change: Rarely, unless you are matching a published bbduk setting.
        cli_flag: --kmer
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is filtered into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --threads
        default: "4"
        effect: Sets how many bbduk worker threads run at once.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the filtered FASTQ gzip-compressed.
    notes: >-
      Window and K-mer sit inside an "Advanced" disclosure group in the Primary
      Settings pane. The pane also notes that 0.6 removes about 4 percent of
      reads and about 89 percent of tandem-repeat reads on the benchmark dataset.

  fastq.remove-duplicates:
    title: Remove Duplicates
    entry_points:
      - "Tools > Decontamination > Remove Duplicates..."
      - "CLI: lungfish-cli fastq deduplicate <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishApp/Views/Viewer/FASTQDatasetViewController.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Preset
        control: popup
        default: Exact PCR
        allowed: Exact PCR, Near Duplicate 1, Near Duplicate 2, Optical HiSeq, Optical NovaSeq, Custom
        effect: Picks a ready-made set of clumpify settings for a common duplicate type. Exact PCR collapses only reads whose sequences match exactly.
        when_to_change: Choose an Optical preset for patterned flowcells, and Custom when you need to set the tolerances yourself.
        cli_flag: derived, sets --subs, --optical, and --dupedist
      - label: Substitutions
        control: number
        default: 0
        allowed: integers 0 and above
        effect: How many mismatched bases two reads may have and still be called duplicates. Zero means only identical sequences collapse.
        when_to_change: Raise it to 1 or 2 when sequencing error is splitting one PCR duplicate family into several.
        cli_flag: --subs
      - label: Optical Duplicates
        control: checkbox
        default: false
        allowed: "true, false"
        effect: Treats reads that sit close together on the flowcell as duplicates of one cluster. These arise from the imaging, not from PCR.
        when_to_change: Turn it on for patterned flowcells such as HiSeq 4000 and NovaSeq.
        cli_flag: --optical
      - label: Optical Distance
        control: number
        default: 40
        allowed: integers above 0
        effect: How many pixels apart two clusters may sit and still count as one optical duplicate. Larger values collapse more neighbouring clusters.
        when_to_change: Use the value recommended for your instrument, typically 40 for HiSeq and 12000 for NovaSeq.
        cli_flag: --dupedist
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is deduplicated into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the deduplicated FASTQ gzip-compressed.
    notes: >-
      Substitutions, Optical Duplicates, and Optical Distance appear only while
      Preset is Custom, and Optical Distance appears only while Optical
      Duplicates is on. The same preset also drives the FASTQ viewport's inline
      parameter bar.

  fastq.merge-overlapping-pairs:
    title: Merge Overlapping Pairs
    entry_points:
      - "Tools > Read Processing > Merge Overlapping Pairs..."
      - "CLI: lungfish-cli fastq merge <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishApp/Services/FASTQDerivativeServiceModels.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Strictness
        control: radio
        default: Normal
        allowed: Normal, Strict
        effect: Chooses how much evidence bbmerge demands before joining a read pair. Strict rejects overlaps that look marginal.
        when_to_change: Use Strict when merged reads are showing mismatches in the joined region.
        cli_flag: --strict
      - label: Minimum Overlap
        control: number
        default: 12
        allowed: integers above 0
        effect: The fewest shared bases the two mates must have before they are joined. Short overlaps can happen by chance.
        when_to_change: Raise it when spurious merges are producing wrong fragment lengths, and lower it for long inserts that barely overlap.
        cli_flag: --min-overlap
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is merged into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the merged FASTQ gzip-compressed.
    notes: >-
      The dialog always passes --count-duplicates, so identical merged sequences
      collapse into counted exemplars whose support is written into the FASTQ
      header as size=N. The CLI leaves that flag off by default. The input must
      be an interleaved FASTQ.

  fastq.repair-paired-end-files:
    title: Repair Paired-End Files
    entry_points:
      - "Tools > Read Processing > Repair Paired-End Files..."
      - "CLI: lungfish-cli fastq repair <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is repaired into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the repaired FASTQ gzip-compressed.
    notes: >-
      Both the Primary and Advanced panes say paired-end repair has no additional
      settings. The input must be an interleaved FASTQ.

  fastq.reverse-complement:
    title: Reverse Complement
    entry_points:
      - "Tools > Read Processing > Reverse Complement..."
      - "CLI: lungfish-cli fastq reverse-complement <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishApp/Views/Viewer/FASTQDatasetViewController.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is reverse-complemented into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the output FASTQ gzip-compressed.
    notes: >-
      Quality scores are reversed along with the sequence, so each base keeps its
      own score. A "Rev. Comp." checkbox also appears on the FASTQ viewport's
      inline parameter bar.

  fastq.translate:
    title: Translate
    entry_points:
      - "Tools > Read Processing > Translate..."
      - "CLI: lungfish-cli fastq translate <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is translated into its own output file or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --frame
        default: "1"
        effect: Chooses the reading frame, 1 to 3 on the forward strand and 4 to 6 on the reverse.
      - flag: --table
        default: "1"
        effect: Chooses the genetic code table, where 1 is the standard code.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the protein FASTA gzip-compressed.
    notes: >-
      The dialog pane states that frame 1 translation is used, so the CLI's
      --frame and --table have no dialog counterpart. The output is FASTA because
      amino-acid sequences carry no per-base quality scores.

  fastq.orient-reads:
    title: Orient Reads
    entry_points:
      - "Tools > Read Processing > Orient Reads..."
      - "CLI: lungfish-cli fastq orient <input> --reference <ref> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishApp/Views/Viewer/FASTQDatasetViewController.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Word Length
        control: number
        default: 12
        allowed: integers above 0
        effect: The length of the exact word vsearch uses to decide which strand a read came from. Longer words are more specific and slower.
        when_to_change: Shorten it when many reads come back unoriented, and lengthen it when reads are being put on the wrong strand.
        cli_flag: --word-length
      - label: Database Mask
        control: radio
        default: dust
        allowed: dust, none
        effect: Chooses whether repetitive stretches of the reference are hidden from matching. The dust method masks low-complexity sequence.
        when_to_change: Choose none when your reference is short and masking is hiding the only usable match region.
        cli_flag: --db-mask
      - label: Extra arguments
        control: text
        default: ""
        allowed: any vsearch command-line arguments
        effect: Extra vsearch options passed straight through after the settings above. They are not checked by the app before vsearch sees them.
        when_to_change: Use it only when you need a vsearch feature the dialog does not expose.
        cli_flag: --extra-args
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is oriented into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only: []
    notes: >-
      The reference is chosen in the Inputs section. A "Save unoriented reads"
      checkbox exists only on the FASTQ viewport's inline parameter bar, where it
      is on by default (FASTQDatasetViewController.swift line 1119). The Tools
      dialog hard-codes saveUnoriented to false
      (FASTQOperationDialogState.swift line 687), and lungfish-cli fastq orient
      exposes no matching flag.

  fastq.correct-sequencing-errors:
    title: Correct Sequencing Errors
    entry_points:
      - "Tools > Read Processing > Correct Sequencing Errors..."
      - "CLI: lungfish-cli fastq error-correct <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: K-mer Size
        control: number
        default: 50
        allowed: integers from 1 to 62
        effect: The word length Tadpole counts across the whole dataset to tell a real base from a sequencing error. A base that breaks an otherwise common word is corrected.
        when_to_change: Lower it for short reads or shallow coverage, since a k-mer longer than the read cannot be counted at all.
        cli_flag: --kmer
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is corrected into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library, because deeper pooled coverage corrects better.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the corrected FASTQ gzip-compressed.
    notes: >-
      The CLI help gives a maximum k-mer of 62. The dialog field does not enforce
      that ceiling, so an out-of-range value is rejected downstream.

  fastq.subsample-by-proportion:
    title: Subsample by Proportion
    entry_points:
      - "Tools > Search & Subsetting > Subsample by Proportion..."
      - "CLI: lungfish-cli fastq subsample <input> --proportion <p> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Proportion
        control: number
        default: empty
        allowed: fractions between 0 and 1
        effect: The share of reads kept, so 0.1 keeps roughly one read in ten. The reads are drawn across the whole file rather than from the start.
        when_to_change: Set it when you want a quick test run whose depth still scales with the size of each library.
        cli_flag: --proportion
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is subsampled into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --count
        default: "unset"
        effect: Keeps a fixed number of reads instead of a fraction, which the dialog exposes as the separate Subsample by Count operation.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the subsampled FASTQ gzip-compressed.
    notes: >-
      The field starts empty, so a proportion must be entered before the Run
      button becomes available.

  fastq.subsample-by-count:
    title: Subsample by Count
    entry_points:
      - "Tools > Search & Subsetting > Subsample by Count..."
      - "CLI: lungfish-cli fastq subsample <input> --count <n> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Count
        control: number
        default: empty
        allowed: integers above 0
        effect: The exact number of reads kept. Every selected library is cut to the same depth.
        when_to_change: Set it when you want libraries of different sizes compared at equal depth.
        cli_flag: --count
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is subsampled into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --proportion
        default: "unset"
        effect: Keeps a fraction of reads instead of a fixed count, which the dialog exposes as the separate Subsample by Proportion operation.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the subsampled FASTQ gzip-compressed.
    notes: >-
      The field starts empty, so a count must be entered before the Run button
      becomes available. Both subsample operations share one CLI subcommand.

  fastq.extract-reads-by-id:
    title: Extract Reads by ID
    entry_points:
      - "Tools > Search & Subsetting > Extract Reads by ID..."
      - "CLI: lungfish-cli fastq search-text <input> --query <q> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Query
        control: text
        default: ""
        allowed: any text, or a regular expression when the regex box is ticked
        effect: The text matched against each read's name line. Reads whose chosen field contains this text are written out.
        when_to_change: Set it to the run or tile prefix, or the exact read name, that identifies the reads you want.
        cli_flag: --query
      - label: Field
        control: radio
        default: ID
        allowed: ID, Description
        effect: Chooses which part of the name line is searched. The ID is the first word after the @ symbol, and the description is everything after it.
        when_to_change: Choose Description when the label you are matching sits in the free-text part of the header.
        cli_flag: --field
      - label: Use Regular Expression
        control: checkbox
        default: false
        allowed: "true, false"
        effect: Treats the query as a pattern rather than plain text. A pattern can match several different names at once.
        when_to_change: Turn it on when one plain query cannot cover every read name you need.
        cli_flag: --regex
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is searched into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the extracted FASTQ gzip-compressed.
    notes: >-
      Results of this operation belong in the project's Extractions folder rather
      than Imports.

  fastq.extract-reads-by-motif:
    title: Extract Reads by Motif
    entry_points:
      - "Tools > Search & Subsetting > Extract Reads by Motif..."
      - "CLI: lungfish-cli fastq search-motif <input> --pattern <p> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Pattern
        control: text
        default: ""
        allowed: a nucleotide motif, or a regular expression when the regex box is ticked
        effect: The sequence motif searched for inside each read. Reads containing it are written out.
        when_to_change: Set it to a restriction site, a primer footprint, or any short sequence that marks the reads you want.
        cli_flag: --pattern
      - label: Use Regular Expression
        control: checkbox
        default: false
        allowed: "true, false"
        effect: Treats the pattern as an expression rather than a literal motif, so it can allow ambiguity or variable spacing.
        when_to_change: Turn it on when the motif has degenerate positions that a plain string cannot express.
        cli_flag: --regex
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is searched into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the extracted FASTQ gzip-compressed.
    notes: >-
      The motif is matched on the read as stored, so the reverse complement is
      not searched unless you write it into the pattern.

  fastq.select-reads-by-sequence:
    title: Select Reads by Sequence
    entry_points:
      - "Tools > Search & Subsetting > Select Reads by Sequence..."
      - "CLI: lungfish-cli fastq sequence-filter <input> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishIO/Formats/FASTQ/FASTQDerivatives.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Sequence or FASTA Path
        control: text
        default: ""
        allowed: a nucleotide sequence, or the path to a FASTA file of sequences
        effect: What the reads are matched against. Typing a sequence matches that one, and giving a file path matches any sequence in the file.
        when_to_change: Use a FASTA path when you are screening against a whole set of adapters or barcodes rather than one.
        cli_flag: --sequence or --fasta-path
      - label: Search End
        control: radio
        default: 5' End
        allowed: 5' End, 3' End
        effect: Chooses which end of the read the sequence must sit at. The 5' end is the start of the read as written.
        when_to_change: Choose 3' End when the sequence you are matching is a read-through adapter at the far end.
        cli_flag: --search-end
      - label: Min Overlap
        control: number
        default: 16
        allowed: integers above 0
        effect: The fewest bases that must align before a match counts. Short overlaps occur by chance in any large dataset.
        when_to_change: Raise it when unrelated reads are matching, and lower it when only a short tail of the sequence remains in the read.
        cli_flag: --min-overlap
      - label: Error Rate
        control: number
        default: 0.15
        allowed: fractions between 0 and 1
        effect: The fraction of matched bases allowed to be wrong. At 0.15 a 20-base match tolerates three mismatches.
        when_to_change: Lower it for clean short reads, and raise it for error-prone long reads.
        cli_flag: --error-rate
      - label: Keep Matched Reads
        control: checkbox
        default: true
        allowed: "true, false"
        effect: Writes out the reads that matched. Turning it off writes out the reads that did not match instead.
        when_to_change: Turn it off when you are using the sequence to remove reads rather than to select them.
        cli_flag: --keep-matched
      - label: Search Reverse Complement
        control: checkbox
        default: false
        allowed: "true, false"
        effect: Also looks for the reverse complement of the sequence, which catches reads stored on the opposite strand.
        when_to_change: Turn it on for unstranded libraries and for long reads whose orientation is arbitrary.
        cli_flag: --search-rc
      - label: Output Strategy
        control: radio
        default: Per Input
        allowed: Per Input, Grouped Result
        effect: Chooses whether each selected dataset is filtered into its own output bundle or all of them are pooled into one.
        when_to_change: Choose Grouped Result when several files belong to one library.
        cli_flag: null
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file.
      - flag: --compress
        default: "false"
        effect: Writes the filtered FASTQ gzip-compressed.
    notes: >-
      Three dialog defaults differ from the CLI defaults. The dialog offers only
      5' End and 3' End while --search-end defaults to both, and its Min Overlap
      of 16 and Error Rate of 0.15 differ from the CLI's 8 and 0.1. The dialog
      also defaults Keep Matched Reads on while --keep-matched is off by default.

  fastq.savont-clustering:
    title: Savont Clustering
    entry_points:
      - "Tools > Clustering > Savont Clustering..."
      - "CLI: lungfish-cli fastq savont-cluster <input> --output <output>"
    gating: [full-length-mhc-genotyping]
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishApp/Services/WorkflowLibrary.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Run Mode
        control: radio
        default: Run separately per bundle
        allowed: "Run separately per bundle (N results), the only option, locked with the caption \"Runs once per bundle\""
        effect: Shows that clustering runs separately for each selected bundle rather than pooling them into one input. The row is locked, so it reports behaviour rather than changing it.
        when_to_change: Rarely, because the picker offers no other mode.
        cli_flag: null
      - label: Output Name
        control: text
        default: derived from the selected bundle's file name
        allowed: any file name
        effect: Names the counted-cluster FASTA the run writes. The default follows the input bundle's name.
        when_to_change: Change it when you are producing several cluster sets from one bundle and need to tell them apart.
        cli_flag: --output
      - label: Threads
        control: number
        default: the machine's active processor count
        allowed: integers above 0
        effect: How many worker threads Savont uses. More threads finish sooner on a machine with spare cores.
        when_to_change: Lower it when you want to keep cores free for other work.
        cli_flag: --threads
      - label: Quality Cutoff
        control: number
        default: 90
        allowed: integers above 0
        effect: The Savont quality-value cutoff that decides which bases are trusted when a cluster consensus is built. Higher values demand better base calls.
        when_to_change: Lower it when too few reads survive to form clusters on a noisy run.
        cli_flag: --quality-value-cutoff
      - label: Min Cluster
        control: number
        default: 3
        allowed: integers above 0
        effect: The fewest reads a cluster must contain before its consensus is reported. Small clusters are usually error, not a real sequence.
        when_to_change: Raise it for deep data to suppress noise, and lower it when a rare true allele is being dropped.
        cli_flag: --min-cluster-size
      - label: Min Read Length
        control: number
        default: empty
        allowed: integers above 0, or empty for no lower bound
        effect: The shortest read fed into clustering, in bases. Shorter reads are ignored.
        when_to_change: Set it to just below your amplicon length so truncated reads do not form their own clusters.
        cli_flag: --min-read-length
      - label: Max Read Length
        control: number
        default: empty
        allowed: integers above 0, or empty for no upper bound
        effect: The longest read fed into clustering, in bases. Longer reads are ignored.
        when_to_change: Set it when concatemers are producing spurious long clusters.
        cli_flag: --max-read-length
      - label: Single-strand mode
        control: checkbox
        default: false
        allowed: "true, false"
        effect: Tells Savont that all reads are already on one strand, so it does not consider reverse complements when grouping them.
        when_to_change: Turn it on only when the reads were oriented beforehand.
        cli_flag: --single-strand
    cli_only: []
    notes: >-
      Run Mode appears only when two or more bundles are selected, and Output
      Name only when exactly one is. Min Read Length, Max Read Length, and
      Single-strand mode sit inside an "Advanced Options" disclosure group.
      This operation has no Output Strategy picker,
      because supportsConfigurableOutput excludes it. It needs the
      full-length-mhc-genotyping pack, which supplies the savont executable.

  fastq.pbaa-amplicon-clustering:
    title: pbAA Amplicon Clustering
    entry_points:
      - "Tools > Clustering > pbAA Amplicon Clustering..."
      - "CLI: lungfish-cli fastq pbaa-cluster <input> --guide <guide> --output-dir <dir>"
    gating: [docker]
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishWorkflow/PBAA/PBAAContainerPins.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Run Mode
        control: radio
        default: Run separately per bundle
        allowed: "Run separately per bundle (N results), the only option, locked with the caption \"Runs once per bundle\""
        effect: Shows that clustering runs separately for each selected bundle rather than pooling them into one input. The row is locked, so it reports behaviour rather than changing it.
        when_to_change: Rarely, because the picker offers no other mode.
        cli_flag: null
      - label: Output Name
        control: text
        default: the input file's name with "-pbaa" appended, or pbaa-clusters when nothing is selected
        allowed: any bundle name
        effect: Names the reference bundle the run writes, and also prefixes the raw pbAA files. It is how the result appears in the project sidebar.
        when_to_change: Change it when you are producing several cluster sets from one bundle and need to tell them apart.
        cli_flag: --output-name
      - label: Threads
        control: number
        default: the machine's active processor count
        allowed: integers above 0
        effect: How many worker threads pbAA uses. More threads finish sooner on a machine with spare cores.
        when_to_change: Lower it when you want to keep cores free for other work.
        cli_flag: --threads
      - label: Seed
        control: number
        default: 1984
        allowed: any integer
        effect: The starting number for pbAA's random choices. Reusing the same seed on the same data reproduces the same clusters.
        when_to_change: Change it only when you want to check that a result does not depend on one particular random start.
        cli_flag: --seed
      - label: pbAA arguments
        control: text
        default: ""
        allowed: any pbaa cluster command-line arguments
        effect: Extra arguments handed to pbaa cluster after the settings above. They are not checked by the app before pbAA sees them.
        when_to_change: Use it only when you need a pbAA feature the dialog does not expose.
        cli_flag: --extra-args
    cli_only: []
    notes: >-
      Run Mode appears only when two or more bundles are selected, and pbAA
      arguments sits inside an "Advanced Options" disclosure group. The
      guide FASTA is chosen in the Inputs section. This operation has no Output
      Strategy picker, and it runs pbAA and samtools from pinned containers, so a
      working container runtime is required.

  import.fastq:
    title: Sequencing Read Files
    entry_points:
      - "File > Import Center... > Sequencing Reads > Sequencing Read Files"
      - "CLI: lungfish-cli import fastq <inputs> --project <project>"
      - "CLI: lungfish-cli import-fastq <inputs> --project <project>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportConfigSheet.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportConfiguration.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenter.swift
      - Sources/LungfishWorkflow/Ingestion/ClumpingTool.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import-fastq.txt
    settings:
      - label: Platform
        control: popup
        default: the platform detected from the read headers
        allowed: Illumina, Oxford Nanopore, PacBio, Element Biosciences, Ultima Genomics, MGI / DNBSEQ, Unknown / Other
        effect: Records which sequencing instrument produced the reads. The choice drives the starting values of Quality Binning and Optimize storage, and it is written into the bundle.
        when_to_change: Change it when the detected platform is wrong, which happens most often with reads that were renamed or reprocessed before you got them.
        cli_flag: --platform
      - label: Pairing
        control: popup
        default: Paired-end when any R1 and R2 mate was matched, otherwise Single-end
        allowed: Single-end, Paired-end, Interleaved
        effect: Tells the importer whether each sample is one file, two mate files, or one file whose mates alternate. Choosing Oxford Nanopore hides this control and treats the reads as single-end.
        when_to_change: Set it to Interleaved when a single file holds both mates, which mate-suffix matching cannot detect.
        cli_flag: null
      - label: Quality Binning
        control: popup
        default: Illumina 4-level for Illumina, Element Biosciences, and MGI / DNBSEQ, and None (preserve original) for the other platforms
        allowed: Illumina 4-level, 8-level, None (preserve original)
        effect: Rounds each base quality score to one of a small set of values so the file compresses harder. Illumina 4-level keeps four values, 8-level keeps eight, and None keeps every original score.
        when_to_change: Choose None when a downstream tool reads exact quality values, for example a variant caller that models per-base error rates.
        cli_flag: --quality-binning
      - label: Optimize storage (reorder reads for better compression)
        control: checkbox
        default: on for Illumina, Element Biosciences, MGI / DNBSEQ, and Ultima Genomics, and off for Oxford Nanopore, PacBio, and Unknown / Other
        allowed: on, off
        effect: Groups reads that share sequence content next to each other before compressing, which shrinks the stored file. Read order in the bundle no longer matches the order in the source file.
        when_to_change: Turn it off on a machine short of memory, or when a downstream step depends on the original read order.
        cli_flag: --no-optimize-storage
      - label: Compression Tool
        control: popup
        default: resolved from the total input size against the machine's memory
        allowed: BBTools clumpify, Trim Galore --clumpify
        effect: Picks the program that does the reordering. Trim Galore also performs adapter detection and removal, quality trimming, and short-read filtering, so it changes the reads and not only their order.
        when_to_change: Pick Trim Galore only when you want its adapter and quality trimming as part of the import.
        cli_flag: --clumping-tool
      - label: Compression Level
        control: popup
        default: Balanced
        allowed: Fast, Balanced, Maximum
        effect: Trades import speed against stored file size. Maximum spends more time compressing and produces the smallest bundle.
        when_to_change: Choose Fast when you are importing a large run and disk space is not the constraint.
        cli_flag: --compression
      - label: Apply processing recipe after import
        control: checkbox
        default: "off"
        allowed: on, off
        effect: Runs a packaged multi-step workflow on the reads as soon as the bundle lands. Leaving it off imports the reads unchanged.
        when_to_change: Turn it on when every sample in this batch needs the same standard processing, so you do not repeat the steps by hand.
        cli_flag: --recipe
      - label: (recipe picker)
        control: popup
        default: the first recipe in the list
        allowed: the bundled recipes VSP2 Target Enrichment, Wastewater metagenomics, and Illumina Amplicon Merge, plus any recipe you have added
        effect: Chooses which packaged workflow runs after import. The description under the picker names the steps that workflow performs.
        when_to_change: Change it whenever the batch calls for a different standard workflow than the one shown.
        cli_flag: --recipe
    cli_only:
      - flag: --samplesheet
        default: none
        effect: Reads sample names and mate file paths from a CSV instead of matching filenames.
      - flag: --dry-run
        default: "false"
        effect: Lists the pairs the importer detected and stops without writing anything.
      - flag: --recursive
        default: "false"
        effect: Walks a directory's subfolders instead of reading only its top level.
      - flag: --force
        default: "false"
        effect: Imports a sample again even when a bundle of that name already sits in the project.
      - flag: --log-dir
        default: none
        effect: Writes one log file per sample into the directory you name.
    notes: >-
      The Import Center card is a file panel that accepts files, folders, or both.
      The settings above live in the Import FASTQ configuration sheet that opens
      after the panel closes, and the same sheet opens when you drag reads onto
      the sidebar. The sheet has no sample-name field, since the sample name comes
      from the shared filename stem. The recipe picker and its description are
      hidden until the recipe checkbox is on.

  import.fastq-sample-sheet:
    title: FASTQ Sample Sheet
    entry_points:
      - "File > Import Center... > Sequencing Reads > FASTQ Sample Sheet"
      - "CLI: lungfish-cli import fastq --samplesheet <sheet.csv> --project <project>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenter.swift
      - Sources/LungfishWorkflow/Ingestion/FASTQSampleSheet.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import-fastq.txt
    settings: []
    cli_only:
      - flag: --samplesheet
        default: none
        effect: Names the CSV whose sample, r1, and r2 columns list the reads to import.
    notes: >-
      The card itself has no controls beyond a file panel that accepts one CSV.
      Every row of the sheet becomes one pair, and the pairs then flow into the
      same Import FASTQ configuration sheet documented under import.fastq, so the
      settings there apply to the whole batch. Columns beyond sample, r1, and r2
      are carried through as per-sample metadata.

  import.ont-run:
    title: ONT Run Folder
    entry_points:
      - "File > Import Center... > Sequencing Reads > ONT Run Folder"
      - "CLI: lungfish-cli import fastq <run-folder> --project <project> --platform ont"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+FASTQImport.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportConfigSheet.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenter.swift
    settings:
      - label: Apply processing recipe after import
        control: checkbox
        default: "off"
        allowed: on, off
        effect: Runs one of the two Oxford Nanopore demultiplexing recipes as the reads land. Leaving it off imports one bundle per barcode folder with no splitting.
        when_to_change: Turn it on when the run pooled several samples behind one barcode and you need them split by an inner barcode.
        cli_flag: null
      - label: (recipe picker)
        control: popup
        default: Split by Fluidigm sample barcodes
        allowed: Split by Fluidigm sample barcodes, Demultiplex full-length MHC ONT amplicons with PacBio barcodes
        effect: Chooses which demultiplexing workflow runs. The Fluidigm option detects the CS1-CS2 insert and assigns a Fluidigm sample barcode, and the PacBio option splits on validated PacBio barcode pairs.
        when_to_change: Pick the option that matches the barcode chemistry the library was built with.
        cli_flag: null
      - label: "Barcode Sheet:"
        control: file
        default: none selected
        allowed: a CSV or TSV file, chosen from the popup of sheets already in the project or through the Choose... button
        effect: Supplies the table that maps barcodes to sample names. The Fluidigm recipe needs sample and barcode columns, and the PacBio recipe needs sample_id, barcode_1, and barcode_2.
        when_to_change: You must set it before either demultiplexing recipe can run, and you change it whenever a different plate layout was used.
        cli_flag: null
      - label: "Demux Folder:"
        control: text
        default: a name derived from the run folder, falling back to ONT Demultiplexed FASTQs
        allowed: any name, with characters outside letters, digits, space, period, underscore, and hyphen replaced
        effect: Names the folder inside the project that collects the per-sample bundles the demultiplexing writes.
        when_to_change: Change it when you are importing more than one run and want the outputs kept apart by run name.
        cli_flag: null
    cli_only:
      - flag: --platform
        default: auto-detect
        effect: Forces the platform to ont rather than letting the importer detect it from the read headers.
    notes: >-
      The card opens a folder-only panel that accepts fastq_pass, a single barcode
      folder, or any folder of FASTQ chunks. The Import FASTQ configuration sheet
      then opens with Oxford Nanopore preselected, so the Platform, Quality
      Binning, Optimize storage, Compression Tool, and Compression Level settings
      documented under import.fastq apply here too. Only this path offers the two
      Oxford Nanopore demultiplexing recipes, and only those recipes reveal the
      Barcode Sheet and Demux Folder controls. The two demultiplexing recipes have
      no CLI equivalent.

  import.bam:
    title: BAM/CRAM Alignments
    entry_points:
      - "File > Import Center... > Alignments > BAM/CRAM Alignments"
      - "CLI: lungfish-cli import bam <input.bam> --output-dir <project>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/Services/BAMImportService.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --name
        default: the input filename
        effect: Sets the display name of the alignment track the import creates.
      - flag: --output-dir
        default: the current directory
        effect: Names the project directory the alignment is imported into.
    notes: >-
      The card has no controls beyond a file panel that accepts one or more .bam
      or .cram files. The importer indexes the alignment, collects per-chromosome
      and per-read-group statistics into a metadata database, and infers the
      reference assembly from the header without asking you to confirm it. A CRAM
      is converted on the way in, and both the original and the converted formats
      are recorded in the track's metadata.

  import.vcf:
    title: VCF Variants
    entry_points:
      - "File > Import Center... > Variants > VCF Variants"
      - "CLI: lungfish-cli import vcf <input.vcf.gz> --output-dir <project>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenter.swift
      - Sources/LungfishApp/App/VCFImportHelper.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
      - docs/user-manual/reviews/fidelity-2026-09/ground-truth/05-variants.md
    settings: []
    cli_only:
      - flag: --output-dir
        default: the current directory
        effect: Names the directory the validated VCF and its index are copied into.
    notes: >-
      The card has no controls beyond a file panel that accepts one or more .vcf
      or .gz files, so which reference bundle the variants join is decided before
      you import, not inside a dialog. With a reference bundle already open in the
      viewport the calls attach to that bundle. With none open the app builds a new
      bundle around the VCF and then tries to fetch a matching reference. There is
      no inferred-reference readout anywhere in this path. A .vcf.gz that arrives
      without a tabix index is bgzipped and indexed during the import, and a
      multi-file import records haploid as the bundle's default ploidy where a
      single-file import records auto.

  import.msa:
    title: Multiple Sequence Alignments
    entry_points:
      - "File > Import Center... > Alignments > Multiple Sequence Alignments"
      - "CLI: lungfish-cli import msa <input> --project <project>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --source-format
        default: detected from the file
        effect: Forces the input to be read as aligned-fasta, clustal, phylip, nexus, stockholm, or a2m-a3m rather than letting the importer detect the format.
      - flag: --name
        default: the input filename
        effect: Sets the display name of the alignment bundle.
      - flag: --output
        default: derived from the project and the name
        effect: Writes the .lungfishmsa bundle to an explicit path instead of into the project.
    notes: >-
      The card has no controls beyond a file panel that accepts one or more
      alignment files. Format detection is automatic in the GUI, and the CLI adds
      a --source-format override for a file whose extension does not match its
      contents. Each accepted file becomes one .lungfishmsa bundle.

  import.tree:
    title: Phylogenetic Trees
    entry_points:
      - "File > Import Center... > Alignments > Phylogenetic Trees"
      - "CLI: lungfish-cli import tree <input> --project <project>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --source-format
        default: detected from the file
        effect: Forces the input to be read as newick or nexus rather than letting the importer detect the format.
      - flag: --name
        default: the input filename
        effect: Sets the display name of the tree bundle.
      - flag: --output
        default: derived from the project and the name
        effect: Writes the .lungfishtree bundle to an explicit path instead of into the project.
    notes: >-
      The card has no controls beyond a file panel that accepts one or more tree
      files, including IQ-TREE .treefile and .contree outputs and RAxML-NG and
      FastTree results. Each accepted file becomes one .lungfishtree bundle.

  import.reference:
    title: Reference Sequences
    entry_points:
      - "File > Import Center... > Reference Sequences > Reference Sequences"
      - "CLI: lungfish-cli import fasta <input> --output-dir <project>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/App/ReferenceImportHelper.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --name
        default: the input filename
        effect: Sets the display name of the reference the import creates.
      - flag: --output-dir
        default: the current directory
        effect: Names the project directory the .lungfishref bundle is written into.
    notes: >-
      The card has no controls beyond a file panel. It accepts FASTA in its several
      extensions, GenBank as .gb, .gbk, .gbff, or .genbank, and EMBL, each of them
      optionally wrapped in .gz, .bgz, .bz2, .xz, or .zst. A GenBank or EMBL record
      carries annotations, so importing one produces a bundle with an annotation
      track already attached, where a bare FASTA does not. The import compresses
      and indexes the sequence and builds the bundle without asking you to confirm
      anything.

  import.annotation-track:
    title: Annotation Track
    entry_points:
      - "File > Import Center... > Reference Sequences > Annotation Track"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenter.swift
      - Sources/LungfishApp/Services/ReferenceBundleAnnotationImportConfigurationPresenter.swift
    settings:
      - label: Reference
        control: popup
        default: the reference bundle currently open in the viewport, otherwise the first bundle found in the project
        allowed: any .lungfishref bundle discovered in the open project
        effect: Chooses which reference sequence the annotations are attached to. Coordinates in the file are read against that reference.
        when_to_change: Change it when the annotations describe a different genome than the one you happen to have open.
        cli_flag: null
      - label: Track Name
        control: text
        default: a name derived from the annotation filename
        allowed: any text
        effect: Sets the label the track shows in the viewport and the annotation table.
        when_to_change: Change it when the filename is opaque, so the track reads as something like RefSeq genes rather than a bare accession.
        cli_flag: null
      - label: Track ID
        control: text
        default: an identifier derived from the annotation filename
        allowed: any text
        effect: Sets the stable identifier the bundle stores for this track. It is what other files refer to, so it should be unique inside the bundle.
        when_to_change: Change it only when the derived identifier collides with a track the bundle already has.
        cli_flag: null
    cli_only: []
    notes: >-
      The card opens a file panel that accepts one or more .gtf, .gff, .gff3, or
      .bed files, and the three settings above then appear in an Import Annotation
      Track alert. Selecting more than one file skips that alert and imports each
      file into the chosen bundle with derived names. The dialog does not appear at
      all when the project holds no reference bundle, so import a reference first.
      There is no CLI equivalent for attaching an annotation track.

  import.geneious:
    title: Geneious Export
    entry_points:
      - "File > Import Center... > Application Exports > Geneious Export"
      - "CLI: lungfish-cli import geneious <source> --project <project>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenter.swift
      - Sources/LungfishApp/Services/CLIApplicationExportImportRunner.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --collection-name
        default: derived from the export
        effect: Names the project collection the imported items are grouped under.
      - flag: --preserve-raw-source
        default: "false"
        effect: Copies the original export archive into the collection alongside the converted items.
      - flag: --no-import-references
        default: "false"
        effect: Leaves standalone reference sequences as plain files instead of converting each into a .lungfishref bundle.
      - flag: --preserve-unsupported
        default: "false"
        effect: Copies artifacts the importer cannot read into a Binary Artifacts folder rather than skipping them.
    notes: >-
      The card has no controls beyond a file panel that accepts one .geneious
      archive or one export folder. The GUI runs the import with only the source
      and the project set, so the four options above are reachable from the command
      line alone. The related import application-export command handles exports from
      CLC Workbench, DNASTAR Lasergene, Benchling, QIIME 2, IGV, and several other
      applications, and those kinds have their own Import Center cards on the same
      tab.

  import.kraken2:
    title: Kraken2 Results
    entry_points:
      - "File > Import Center... > Classification Results > Kraken2 Results"
      - "CLI: lungfish-cli import kraken2 <kreport-file>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishWorkflow/Metagenomics/MetagenomicsImportService.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --output
        default: none
        effect: Names the Kraken2 per-read output file so the import can link individual reads to the taxa they were assigned.
      - flag: --name
        default: derived from the report
        effect: Names the imported result, which becomes the name of its directory.
      - flag: --output-dir
        default: the current directory
        effect: Names the project directory the imported result is written into.
    notes: >-
      The card has no controls beyond a file panel that accepts one or more
      .kreport, .kreport2, .bracken, or .txt files. Use this card only for a run
      produced outside Lungfish Genome Explorer, since a run started inside the app
      lands in the project on its own. The imported result appears under the
      project's Analyses folder.

  import.esviritu:
    title: EsViritu Results
    entry_points:
      - "File > Import Center... > Classification Results > EsViritu Results"
      - "CLI: lungfish-cli import esviritu <results-dir>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishWorkflow/Metagenomics/MetagenomicsImportService.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --name
        default: derived from the results directory
        effect: Names the imported result, which becomes the name of its directory.
      - flag: --output-dir
        default: the current directory
        effect: Names the project directory the imported result is written into.
    notes: >-
      The card has no controls beyond a file panel that accepts .tsv or .txt files
      or a whole results directory. The CLI takes the results directory as its only
      positional argument.

  import.taxtriage:
    title: TaxTriage Results
    entry_points:
      - "File > Import Center... > Classification Results > TaxTriage Results"
      - "CLI: lungfish-cli import taxtriage <results-dir>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishWorkflow/Metagenomics/MetagenomicsImportService.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --name
        default: derived from the results directory
        effect: Names the imported result, which becomes the name of its directory.
      - flag: --output-dir
        default: the current directory
        effect: Names the project directory the imported result is written into.
    notes: >-
      The card has no controls beyond a file panel that accepts .tsv, .csv, or .txt
      files or a whole results directory. The CLI takes the results directory as its
      only positional argument.

  import.nao-mgs:
    title: NAO-MGS Results
    entry_points:
      - "File > Import Center... > Classification Results > NAO-MGS Results"
      - "CLI: lungfish-cli import nao-mgs <input-path>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/Views/Metagenomics/NaoMgsImportSheet.swift
      - Sources/LungfishApp/App/AppDelegate+ToolsMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --sample-name
        default: derived from the results
        effect: Overrides the sample name recorded on the imported bundle.
      - flag: --no-fetch-references
        default: reference fetching is on
        effect: Skips downloading a reference FASTA from NCBI for each virus the results name.
      - flag: --output-dir
        default: the current directory
        effect: Names the project directory the imported bundle is written into.
    notes: >-
      This card opens a wizard sheet titled NAO-MGS Import rather than a plain file
      panel, but the sheet holds no settings. It has a Browse... button, a read-only
      path readout, and a Validation section that reports Valid NAO-MGS results once
      it finds the virus-hits table. Point it at a results directory or at
      virus_hits_final.tsv.gz directly. The imported result lands under the project's
      Analyses folder as naomgs-<sample>.

  import.nvd:
    title: NVD Results
    entry_points:
      - "File > Import Center... > Classification Results > NVD Results"
      - "CLI: lungfish-cli import nvd <input-path>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/Views/Metagenomics/NvdImportSheet.swift
      - Sources/LungfishApp/App/AppDelegate+ToolsMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --name
        default: nvd-{experiment}
        effect: Overrides the name of the imported bundle.
      - flag: --output-dir
        default: the current directory
        effect: Names the project directory the imported bundle is written into.
    notes: >-
      NVD stands for Novel Virus Diagnostics. This card opens a wizard sheet titled
      NVD Import rather than a plain file panel, but the sheet holds no settings.
      It has a Browse... button, a read-only path readout, and a Preview section
      that scans the run and reports the experiment identifier and the sample,
      contig, and hit counts before you commit. Point it at the top-level run
      directory, the one containing 05_labkey_bundling/.

  import.cz-id:
    title: CZ-ID Results
    entry_points:
      - "File > Import Center... > Classification Results > CZ-ID Results"
      - "CLI: lungfish-cli import cz-id <input-path> --project <project> --sample-name <name>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/Views/Metagenomics/CzIdImportSheet.swift
      - Sources/LungfishApp/App/AppDelegate+ToolsMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --sample-name
        default: none, and the flag is required
        effect: Names the .lungfishtax bundle the import creates.
      - flag: --metadata
        default: none
        effect: Records the path of a CZ-ID metadata sidecar in the bundle's provenance.
      - flag: --non-host-fastq
        default: none
        effect: Records the path of the run's non-host FASTQ in the bundle's provenance.
    notes: >-
      CZ-ID is a hosted service, so this is an import path only and there is no way
      to run CZ-ID from inside the app. The card opens a wizard sheet titled CZ-ID
      Import whose three sections, CZ-ID Export, Preview, and Project Destination,
      hold no editable settings beyond the Browse... button. Point it at a taxon
      report TSV, a ZIP export, or an extracted export folder. The imported bundle
      lands under the project's Classifications folder and opens in the sunburst
      taxonomy viewport.

  import.sample-metadata:
    title: Import Metadata
    entry_points:
      - "Inspector > Import Metadata..."
      - "Annotation table drawer > Samples tab > Import Metadata..."
      - "CLI: lungfish-cli import sample-metadata <input-path> --bundle <bundle>"
      - "CLI: lungfish-cli import metadata <input-path> --bundle <bundle>"
    gating: []
    sources:
      - Sources/LungfishApp/App/AppFilePanelFactory.swift
      - Sources/LungfishApp/Views/Inspector/InspectorView.swift
      - Sources/LungfishApp/Views/Viewer/AnnotationTableDrawerView.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/import.txt
    settings: []
    cli_only:
      - flag: --bundle
        default: none, and the flag is required
        effect: Names the bundle the metadata rows are attached to. import sample-metadata expects a reference bundle, and import metadata expects a result bundle such as a naomgs- or kraken2- directory.
    notes: >-
      Import Metadata... opens a file panel that accepts one .tsv, .csv, or .txt
      file, and it has no other controls. The rows are matched to samples already
      in the bundle, so the metadata joins existing variant or result tracks rather
      than creating anything new. The two CLI subcommands differ only in the kind of
      bundle they accept.

  fetch.ncbi:
    title: Search NCBI
    entry_points:
      - "Tools > Search Online Databases > Search NCBI..."
      - "CLI: lungfish-cli fetch search <query>"
      - "CLI: lungfish-cli fetch ncbi <accession>"
      - "CLI: lungfish-cli fetch genome <accession>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/DatabaseBrowser/GenBankGenomesSearchPane.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserPane.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserViewController.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseSearchDialogState.swift
      - Sources/LungfishApp/ViewModels/GenBankBundleDownloadViewModel.swift
      - Sources/LungfishCore/Services/NCBI/NCBIService.swift
      - Sources/LungfishApp/App/MainMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fetch.txt
    settings:
      - label: Mode
        control: radio
        default: Nucleotide
        allowed: Nucleotide, Genome, Virus
        effect: Chooses which NCBI collection is searched. Nucleotide returns individual GenBank records, Genome returns assemblies, and Virus queries the NCBI Datasets virus service with its own filters.
        when_to_change: Switch to Genome when you want a whole assembly such as a human or macaque reference, and to Virus when you want a curated viral record set.
        cli_flag: --db
      - label: RefSeq Only
        control: checkbox
        default: "off"
        allowed: on, off
        effect: Restricts results to RefSeq records, the curated subset NCBI maintains, instead of every submitted GenBank entry.
        when_to_change: Turn it on when you want one canonical sequence per organism rather than every deposited variation of it.
        cli_flag: null
      - label: Include GFF3 Annotations
        control: checkbox
        default: "on"
        allowed: on, off
        effect: Downloads the record's gene and feature annotations alongside its sequence and attaches them to the bundle as a track.
        when_to_change: Turn it off when you only need the raw sequence, which makes the download smaller and faster.
        cli_flag: --fasta-only
      - label: (search scope)
        control: popup
        default: All Fields
        allowed: All Fields, Accession, Organism, Title, BioProject, Author
        effect: Restricts the query text to one indexed field rather than matching anywhere in the record.
        when_to_change: Narrow it to Accession when you already know the identifier, so a common word in a title cannot swamp the results.
        cli_flag: null
      - label: Organism
        control: text
        default: empty
        allowed: any organism name
        effect: Adds an organism term to the query, so only records from that species or group come back.
        when_to_change: Fill it when a query word such as a gene name occurs across many species.
        cli_flag: --organism
      - label: Location
        control: text
        default: empty
        allowed: any place name
        effect: Adds a geographic term to the query, matching where the sample was collected.
        when_to_change: Fill it when you are assembling a regional sequence set.
        cli_flag: null
      - label: Gene
        control: text
        default: empty
        allowed: any gene symbol
        effect: Adds a gene term to the query, so only records annotated with that gene come back.
        when_to_change: Fill it when you want one locus rather than whole genomes.
        cli_flag: null
      - label: Author
        control: text
        default: empty
        allowed: any author name
        effect: Adds an author term to the query, matching the people credited on the submission.
        when_to_change: Fill it when you are chasing the sequences behind a particular paper.
        cli_flag: null
      - label: Journal
        control: text
        default: empty
        allowed: any journal name
        effect: Adds a journal term to the query, matching where the record was published.
        when_to_change: Fill it alongside Author to pin down one publication.
        cli_flag: null
      - label: Molecule Type
        control: popup
        default: Any
        allowed: Any, Genomic DNA, mRNA, rRNA, tRNA, Genomic RNA, crRNA
        effect: Restricts results to records of one molecule type, which separates a genomic sequence from a transcript of the same gene.
        when_to_change: Set it to mRNA when you want spliced transcripts, or to Genomic DNA when you want the locus itself.
        cli_flag: null
      - label: Sequence Length
        control: text
        default: empty on both sides
        allowed: two whole numbers in base pairs, either of which may be left blank
        effect: Keeps only records whose sequence falls between the two lengths you enter.
        when_to_change: Set a minimum to drop short partial fragments from a query that returns thousands of them.
        cli_flag: null
      - label: Publication Date
        control: text
        default: empty on both sides
        allowed: two dates, either of which may be left blank
        effect: Keeps only records published inside the range you enter.
        when_to_change: Set a start date to exclude older records that have been superseded.
        cli_flag: null
      - label: Sequence Properties
        control: checkbox
        default: none checked
        allowed: Has CDS, Has Gene, Has Source, Has tRNA, Has rRNA
        effect: Keeps only records that carry the annotation features you check. The checked properties combine, so a record must have all of them.
        when_to_change: Check Has CDS when you need coding regions and a bare sequence is no use to you.
        cli_flag: null
      - label: Host
        control: text
        default: empty
        allowed: any host organism name
        effect: In Virus mode, keeps only records whose sample came from that host.
        when_to_change: Fill it to separate human isolates from animal ones in a zoonotic virus query.
        cli_flag: null
      - label: Geographic Location
        control: text
        default: empty
        allowed: any place name
        effect: In Virus mode, keeps only records collected in that place.
        when_to_change: Fill it when you are building a regional viral sequence set.
        cli_flag: null
      - label: Completeness
        control: popup
        default: Any
        allowed: Any, Complete, Partial
        effect: In Virus mode, keeps only whole genomes or only partial ones.
        when_to_change: Set it to Complete when you are building an alignment and partial sequences would leave large gaps.
        cli_flag: null
      - label: Released Since
        control: text
        default: empty
        allowed: a date written YYYY-MM-DD
        effect: In Virus mode, keeps only records released on or after that date.
        when_to_change: Fill it when you are topping up a set you downloaded earlier.
        cli_flag: null
      - label: Annotated Only
        control: checkbox
        default: "off"
        allowed: on, off
        effect: In Virus mode, keeps only records that carry gene annotations.
        when_to_change: Turn it on when the downstream work needs gene coordinates rather than sequence alone.
        cli_flag: null
    cli_only:
      - flag: --fetch-format
        default: genbank
        effect: Chooses whether fetch ncbi returns genbank, fasta, gff3, or xml for the accessions you name.
      - flag: --limit
        default: "20"
        effect: Caps how many results fetch search returns.
      - flag: --api-key
        default: none
        effect: Sends your NCBI API key so the service allows a higher request rate.
      - flag: --no-retry
        default: "false"
        effect: Stops fetch ncbi from retrying after NCBI answers with a rate-limit response.
      - flag: --save-to
        default: standard output
        effect: Writes the fetched record to a file path instead of printing it.
      - flag: --name
        default: derived from the assembly
        effect: Names the .lungfishref bundle fetch genome builds.
      - flag: --no-bundle
        default: "false"
        effect: Downloads the genome files without assembling them into a .lungfishref bundle.
    notes: >-
      The dialog is the Database Browser opened on its GenBank & Genomes pane, and
      the three destinations GenBank & Genomes, SRA Runs, and Pathoplexus sit in
      its sidebar. The Mode, RefSeq Only, and Include GFF3 Annotations controls are
      the pane's own, and the query field with its scope popup and the Advanced
      Search Filters panel below it are shared with the other two destinations. The
      filter panel is collapsed until you click Show, and its contents change with
      Mode, so the Host through Annotated Only settings appear in Virus mode while
      Organism through Sequence Properties appear in the other two modes. The
      primary button reads Search until you tick a result, then reads Download
      Selected. Selecting more than fifty records prompts you to confirm first. A
      downloaded record becomes an indexed .lungfishref bundle in the project.

  fetch.sra:
    title: Search SRA
    entry_points:
      - "Tools > Search Online Databases > Search SRA..."
      - "CLI: lungfish-cli fetch sra search <query>"
      - "CLI: lungfish-cli fetch sra download <accession>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/DatabaseBrowser/SRARunsSearchPane.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserPane.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserViewController.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseSearchDialogState.swift
      - Sources/LungfishCore/Services/NCBI/SRAService.swift
      - Sources/LungfishApp/App/MainMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fetch.txt
    settings:
      - label: Platform
        control: popup
        default: Any
        allowed: Any, ILLUMINA, OXFORD_NANOPORE, PACBIO_SMRT, ION_TORRENT, ULTIMA, ELEMENT, BGISEQ
        effect: Keeps only runs produced on that sequencing instrument family.
        when_to_change: Set it when your analysis assumes one read type, since short and long reads need different tools.
        cli_flag: null
      - label: Strategy
        control: popup
        default: Any
        allowed: Any, WGS, AMPLICON, RNA-Seq, WXS, Targeted-Capture, OTHER
        effect: Keeps only runs whose library was built for that purpose. WGS is whole-genome shotgun and AMPLICON is targeted PCR product.
        when_to_change: Set it to AMPLICON when you want tiled primer-scheme data and whole-genome runs would be off target.
        cli_flag: null
      - label: Layout
        control: popup
        default: Any
        allowed: Any, PAIRED, SINGLE
        effect: Keeps only runs whose reads come in mate pairs, or only runs whose reads are single.
        when_to_change: Set it to PAIRED when the workflow you plan to run needs both mates.
        cli_flag: null
      - label: Min Size (Mbases)
        control: text
        default: empty
        allowed: a whole number of megabases
        effect: Drops runs that produced less sequence than the amount you enter, measured in millions of bases.
        when_to_change: Set it to exclude shallow runs that will not give enough depth for your analysis.
        cli_flag: null
      - label: Publication Date
        control: text
        default: empty on both sides
        allowed: two dates, either of which may be left blank
        effect: Keeps only runs released inside the range you enter.
        when_to_change: Set a start date when you are following an outbreak and older runs are irrelevant.
        cli_flag: null
      - label: Max Results
        control: popup
        default: "50"
        allowed: 50, 100, 200, 500, 1000
        effect: Caps how many runs the search returns.
        when_to_change: Raise it when a broad query is clearly truncating results you need.
        cli_flag: --limit
      - label: (search scope)
        control: popup
        default: All Fields
        allowed: All Fields, Accession, Organism, Title, BioProject, Author
        effect: Restricts the query text to one indexed field rather than matching anywhere in the run record.
        when_to_change: Narrow it to BioProject when you want every run from one study.
        cli_flag: null
    cli_only:
      - flag: --output-dir
        default: the current directory
        effect: Names the directory fetch sra download writes the FASTQ files into.
      - flag: --use-toolkit
        default: "false"
        effect: Downloads through the SRA Toolkit instead of the ENA mirrors, which needs prefetch and fasterq-dump installed.
      - flag: --api-key
        default: none
        effect: Sends your NCBI API key so the service allows a higher request rate.
    notes: >-
      The dialog is the Database Browser opened on its SRA Runs pane. The pane's own
      control is an Import Accessions button that loads a CSV or plain-text list of
      run identifiers when you already know which runs you want, and the six filters
      above sit in the shared Advanced Search Filters panel, which is collapsed until
      you click Show. Choosing runs and clicking Download Selected opens the Import
      FASTQ configuration sheet documented under import.fastq, so the platform,
      binning, and compression settings apply to the download too. Files come from
      the ENA mirrors over plain HTTP, so no SRA Toolkit install is needed, and each
      run lands as a .lungfishfastq bundle under the project's Imports folder with
      its ENA provenance recorded.

  fetch.pathoplexus:
    title: Search Pathoplexus
    entry_points:
      - "Tools > Search Online Databases > Search Pathoplexus..."
    gating: []
    sources:
      - Sources/LungfishApp/Views/DatabaseBrowser/PathoplexusSearchPane.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserPane.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserViewController.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseSearchDialogState.swift
      - Sources/LungfishApp/App/MainMenu.swift
    settings:
      - label: Organism
        control: radio
        default: Mpox virus
        allowed: Crimean-Congo hemorrhagic fever, Sudan ebolavirus, Zaire ebolavirus, Human metapneumovirus, Marburg virus, Measles virus, Mpox virus, RSV-A, RSV-B, West Nile virus
        effect: Chooses which pathogen's records are searched. Pathoplexus keeps one collection per organism, so changing this clears the current results.
        when_to_change: Change it whenever you move to a different pathogen, since there is no way to search across all of them at once.
        cli_flag: null
      - label: Country
        control: text
        default: empty
        allowed: any country name
        effect: Keeps only records whose sample was collected in that country.
        when_to_change: Fill it when you are assembling a national or regional set.
        cli_flag: null
      - label: Host
        control: text
        default: empty
        allowed: any host organism name
        effect: Keeps only records whose sample came from that host species.
        when_to_change: Fill it to separate human cases from animal reservoir samples.
        cli_flag: null
      - label: Clade
        control: text
        default: empty
        allowed: any clade label the organism uses
        effect: Keeps only records assigned to that clade, a named branch of the pathogen's family tree.
        when_to_change: Fill it when one clade is the subject and the rest are background.
        cli_flag: null
      - label: Lineage
        control: text
        default: empty
        allowed: any lineage label the organism uses
        effect: Keeps only records assigned to that lineage, which is a finer division than a clade.
        when_to_change: Fill it when you are tracking a specific descendant group inside a clade.
        cli_flag: null
      - label: Nucleotide Mutations
        control: text
        default: empty
        allowed: comma-separated mutations written as reference base, position, and new base, for example C180T
        effect: Keeps only records carrying every mutation you list, matched against the genome sequence.
        when_to_change: Fill it when you are following one defining change through a population.
        cli_flag: null
      - label: Amino Acid Mutations
        control: text
        default: empty
        allowed: comma-separated gene and change pairs, for example GP:440G
        effect: Keeps only records carrying every protein-level change you list.
        when_to_change: Fill it when the change of interest is in the protein rather than the nucleotide sequence, for example a known antibody-escape site.
        cli_flag: null
      - label: Collection Date
        control: text
        default: empty on both sides
        allowed: two dates, either of which may be left blank
        effect: Keeps only records whose sample was collected inside the range you enter. This is the sampling date, not the date the record was published.
        when_to_change: Set it when you are reconstructing one season or one outbreak window.
        cli_flag: null
      - label: Sequence Length
        control: text
        default: empty on both sides
        allowed: two whole numbers in base pairs, either of which may be left blank
        effect: Keeps only records whose sequence falls between the two lengths you enter.
        when_to_change: Set a minimum to drop fragments too short to be worth aligning.
        cli_flag: null
      - label: INSDC Source
        control: popup
        default: Any
        allowed: Any, INSDC Only, Non-INSDC Only
        effect: Splits records by whether they also appear in the international sequence databases GenBank, ENA, and DDBJ. Non-INSDC Only shows records deposited to Pathoplexus alone.
        when_to_change: Set it to Non-INSDC Only when you want records you could not have found through NCBI.
        cli_flag: null
      - label: (search scope)
        control: popup
        default: All Fields
        allowed: All Fields, Accession, Organism, Title, BioProject, Author
        effect: Restricts the query text to one indexed field rather than matching anywhere in the record.
        when_to_change: Narrow it to Accession when you already know the identifier.
        cli_flag: null
    cli_only: []
    notes: >-
      The dialog is the Database Browser opened on its Pathoplexus pane. On first
      use the pane shows an access and benefit sharing notice titled Pathoplexus
      Access and Benefit Sharing, and nothing else works until you click I
      Understand and Agree. The organism chips are the pane's own control, and the
      nine filters below them sit in the shared Advanced Search Filters panel, which
      is collapsed until you click Show. Lungfish Genome Explorer retrieves only
      records marked OPEN, so restricted sequences never appear in the results. There
      is no CLI equivalent for Pathoplexus.

  map.minimap2:
    title: Map Reads (minimap2)
    entry_points:
      - "Tools > Mapping > minimap2"
      - "CLI: lungfish-cli map <fastq-files> --reference <reference> --mapper minimap2"
    gating: [read-mapping]
    sources:
      - Sources/LungfishApp/Views/Mapping/MappingWizardSheet.swift
      - Sources/LungfishWorkflow/Mapping/MappingTool.swift
      - Sources/LungfishKit/MultiBundleRunModePicker.swift
      - Sources/LungfishApp/Services/WorkflowLibrary.swift
      - Sources/LungfishApp/App/ToolsMenuModel.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/map.txt
    settings:
      - label: Reference
        control: popup
        default: the first reference the app finds in the project
        allowed: any reference sequence in the project, or a FASTA you choose with Browse...
        effect: Names the genome the reads are lined up against. Every coordinate in the resulting alignment is a position in this sequence, so a different reference gives different coordinates.
        when_to_change: Change it whenever the reads came from a different organism or a different strain than the one the picker happened to select first.
        cli_flag: --reference
      - label: Preset
        control: radio
        default: Short-read
        allowed: Short-read, Assembly-to-assembly, Spliced CDS/cDNA, Oxford Nanopore, PacBio HiFi, PacBio CLR
        effect: Tells minimap2 what kind of sequence it is being handed so it can pick scoring rules that match. Short reads and long noisy reads need very different error tolerances.
        when_to_change: Match it to the machine that made your reads, since the dialog only guesses from the first read in the file and the guess can be wrong.
        cli_flag: --preset
      - label: Run Mode
        control: radio
        default: Run separately per bundle
        allowed: Run separately per bundle, Combine all inputs and run once
        effect: Decides whether several selected read sets each get their own alignment or all get poured into one. Combining loses the ability to tell which read came from which sample.
        when_to_change: Combine only when the selected files really are pieces of one library, for example two sequencing runs of the same tube.
        cli_flag: null
      - label: ID (--rg-id)
        control: text
        default: the sample name taken from the input file
        allowed: any text without spaces
        effect: Writes a read-group identifier into the alignment file so downstream tools can tell one batch of reads from another. It is a label, not a filter.
        when_to_change: Set it when you plan to merge this alignment with others and need each batch to stay distinguishable.
        cli_flag: --rg-id
      - label: Sample (--rg-sm)
        control: text
        default: the sample name taken from the input file
        allowed: any text
        effect: Records which biological sample the reads came from. Joint variant callers group reads by this field, so two files sharing a sample name are treated as one individual.
        when_to_change: Set it to your real specimen identifier when the file name is not one.
        cli_flag: --rg-sm
      - label: Library (--rg-lb)
        control: text
        default: the sample name taken from the input file
        allowed: any text
        effect: Records which sequencing library the reads came from. Duplicate marking uses it, since two copies of one fragment can only be duplicates if they came from the same library.
        when_to_change: Set it when one sample was prepared as two separate libraries and you want duplicates judged within each.
        cli_flag: --rg-lb
      - label: Platform (--rg-pl)
        control: text
        default: filled in from the preset you chose
        allowed: a platform name such as ILLUMINA, ONT, or PACBIO
        effect: Records the sequencing technology. Some variant callers change their error model based on it.
        when_to_change: Correct it when the preset guessed a platform that does not match your instrument.
        cli_flag: --rg-pl
      - label: Platform unit (--rg-pu)
        control: text
        default: the sample name taken from the input file
        allowed: any text
        effect: Records the exact flow cell and lane the reads came off. It is the finest-grained batch label in the read group.
        when_to_change: Fill it when you are chasing a run-specific artifact and need to separate lanes.
        cli_flag: --rg-pu
      - label: "Threads:"
        control: number
        default: the number of processor cores in your Mac
        allowed: 1 up to the number of cores
        effect: Sets how many pieces of the mapping job run at the same time. More threads finish sooner but leave less of the machine for anything else.
        when_to_change: Lower it when you want to keep working in other applications while a large run finishes.
        cli_flag: --threads
      - label: "Secondary alignments:"
        control: checkbox
        default: "false"
        allowed: on or off
        effect: Keeps the extra places a read could also have come from, not just its best one. Repeated regions produce many of these.
        when_to_change: Turn it on when you are studying repeats or gene families and need to see every plausible placement.
        cli_flag: --secondary
      - label: "Supplementary:"
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Keeps the leftover pieces of a read that spans a break, where one part lands in one place and the rest lands elsewhere. These are the signature of a structural rearrangement.
        when_to_change: Turn it off only when a downstream tool chokes on split records.
        cli_flag: --no-supplementary
      - label: "Min mapping quality:"
        control: number
        default: "0"
        allowed: 0 to 60
        effect: Throws away any read the mapper was not confident it placed correctly. Mapping quality is a confidence score, and 0 means the mapper could not choose between two or more locations.
        when_to_change: Raise it to about 20 when repeated sequence is putting reads in the wrong place and inflating false variants.
        cli_flag: --min-mapq
      - label: Extra arguments
        control: text
        default: empty
        allowed: any minimap2 options, written the way you would type them at a command line
        effect: Passes options straight through to minimap2 untouched. Nothing in the app checks that they make sense.
        when_to_change: Use it only when a published protocol names a minimap2 flag the dialog does not expose.
        cli_flag: --extra-args
    cli_only:
      - flag: --mapper
        default: minimap2
        effect: Chooses which of the four mappers runs, a choice the GUI makes for you through the menu item you click.
      - flag: -o, --output-dir
        default: a folder named mapping-<id> beside the input
        effect: Writes the sorted BAM and its index into a directory you name.
      - flag: --sample-name
        default: taken from the input file name
        effect: Names the sample for both the read groups and the output file names.
      - flag: --paired
        default: "false"
        effect: Binds exactly two input files as the first and second reads of the same fragments.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
    notes: >-
      The wizard is 560 by 560 points and its header reads "Map Reads (minimap2)".
      Read Group and Advanced Settings are collapsed disclosure groups, so a reader
      who never opens them gets every default above. When more than one read set is
      selected and Run Mode is left on per bundle, the Read Group fields are replaced
      by a notice reading "Each bundle gets its own read group, derived automatically
      from its sample name." An Input Compatibility panel above Advanced Settings
      reports the detected format, the detected read type, and the longest read seen,
      and it disables Run when the preset and the reads do not match. Output is always
      a coordinate-sorted, indexed BAM.

