# Captured from Lungfish Preview 2026.9.13 with capture-window.sh (2026-09 campaign).
# App state: The assembly viewport with the sole contig row selected, filling the detail pane with its header, length, GC percent, rank, share of the assembly, and sequence.
id: contig-detail-pane
chapter: 07-assembly/02-running-spades
caption: The detail pane for the longest contig, showing its header, length, GC percent, rank, share of
  the assembly, and sequence.
viewport_class: assembly
app_state:
  fixture: '{demo_project}'
  open_files:
  - assembly: Analyses/HG002-chrM
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
