  # PROSE-ONLY: Collapse Analyses and Imports, then crop the sidebar around Reference Sequences. Window-relative crop 0,345,341,220.
crop:
  mode: region
  region:
  - 0
  - 345
  - 341
  - 220
post:
  retina: true
  format: png
