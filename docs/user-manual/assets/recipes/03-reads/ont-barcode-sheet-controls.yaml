# Captured from Lungfish Preview 2026.9.13 with capture-window.sh (2026-09 campaign).
# App state: ONT import with optional Fluidigm recipe enabled only to show controls. Example CSV selected, not used to process HG002 reads. Barcode picker overflows fixed sheet width, hiding Choose.
id: ont-barcode-sheet-controls
chapter: 03-reads/07-ont-runs
caption: The Barcode Sheet and Demux Folder controls that appear on the configuration sheet once a nanopore
  demultiplexing recipe is chosen.
viewport_class: none
app_state:
  fixture: '{demo_project}'
  open_files: []
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
  app: Lungfish Preview
- action: wait_ready
  signal: main_window_visible
- action: resize_window
  size:
  - 1400
  - 900
  # PROSE-ONLY: Prepare example.csv with header sample,barcode and illustrative row Demo sample,FLD0001 in Desktop/lge-docs.
  # PROSE-ONLY: Open ONT Run Folder import and select ont-run/fastq_pass.
  # PROSE-ONLY: Enable Apply processing recipe after import and retain Split by Fluidigm sample barcodes.
  # PROSE-ONLY: Click Choose and select example.csv, then capture Barcode Sheet and Demux Folder controls.
  # PROSE-ONLY: Disable Apply processing recipe after import before importing the unmodified ONT reads.
crop:
  mode: region
  region:
  - 780
  - 523
  - 560
  - 520
post:
  retina: true
  format: png
