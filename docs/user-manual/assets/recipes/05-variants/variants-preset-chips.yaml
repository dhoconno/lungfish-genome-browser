# Captured from Lungfish Preview 2026.9.13 with capture-window.sh (2026-09 campaign).
# App state: The Variants tab's chip strip with the sidebar and Inspector hidden and the window back at 1400 points, showing the Biological Effect, Quality / QC and Population / Frequency groups; the Sample / Genotype group sits past the right edge even at this width.
id: variants-preset-chips
chapter: 05-variants/02-reading-the-variant-browser
caption: The Presets chip strip open above the Variants table, grouped into the Biological Effect, Quality
  / QC, Population / Frequency, and Sample / Genotype sections.
viewport_class: variant
app_state:
  fixture: '{demo_project}'
  open_files:
  - reference: Reference Sequences/chr20_10.0-10.5Mb.lungfishref
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
  app: Lungfish Preview
- action: wait_ready
  signal: main_window_visible
- action: resize_window
  size:
  - 1400
  - 900
  # PROSE-ONLY: Select chr20_10.0-10.5Mb and click the drawer's Variants tab
  # PROSE-ONLY: Choose View > Hide Sidebar, click the toolbar Inspector button, and set the window back to 1400 by 900
  # PROSE-ONLY: Capture the chip strip region, then choose View > Show Sidebar and reopen the Inspector
crop:
  mode: region
  region:
  - 0
  - 658
  - 1400
  - 90
post:
  retina: true
  format: png
