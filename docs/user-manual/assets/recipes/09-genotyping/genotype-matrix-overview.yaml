# Captured from Lungfish Preview 2026.9.13 with capture-window.sh (2026-09 campaign).
# App state: The genotype viewport open on the Williams amplicon-genotyping_3 result (the 30-sample cohort run), matrix visible with allele-target rows and one column per sample.
id: genotype-matrix-overview
chapter: 09-genotyping/01-what-is-mhc-genotyping
caption: The Genotype Matrix view of the Williams MiSeq genotyping result, with allele-target rows down
  the left named by their reference record and one column per sample across the top.
viewport_class: genotype
app_state:
  fixture: '{williams_project}'
  open_files: []
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
  app: Lungfish Preview
- action: wait_ready
  signal: main_window_visible
- action: resize_window
  size:
  - 1400
  - 900
  # PROSE-ONLY: In the sidebar, expand Analyses > Amplicon genotyping results.
  # PROSE-ONLY: Click amplicon-genotyping_3 (the 30-sample, 2109-call Williams cohort run) and press Return to open the genotype matrix.
  # PROSE-ONLY: Capture the full window: sidebar, matrix with pinned Genotype/Locus columns and one column per sample, and the Inspector's Bundle/Run Summary panel.
crop:
  mode: window
post:
  retina: true
  format: png
