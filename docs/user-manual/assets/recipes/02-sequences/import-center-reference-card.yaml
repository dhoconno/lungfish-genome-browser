# Captured from Lungfish Preview 2026.9.13 with capture-window.sh (2026-09 campaign).
# Shared with 01-foundations; same capture, copied for this part.
# App state: The Import Center window on the Reference Sequences tab, showing the Reference Sequences, Annotation Track, and Primer Scheme cards with their Import buttons.
id: import-center-reference-card
chapter: 02-sequences/01-importing-and-viewing
caption: The Import Center with the Reference Sequences tab open and the Reference Sequences card ready
  to accept a dropped file.
viewport_class: none
app_state:
